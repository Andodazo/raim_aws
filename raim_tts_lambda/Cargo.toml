[package]
name = "raim-tts-lambda"
version = "0.1.0"
edition = "2021"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"

[dependencies]
base64 = "0.21"
lambda_runtime = "0.7"
lazy_static = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
vvcore = "0.0.2"
